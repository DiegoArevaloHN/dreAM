name: Verificar presentación

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela el run anterior de la misma rama: evita que un run
# atascado siga consumiendo minutos y que el PR muestre un estado obsoleto.
#
# `head_ref` (la rama del PR) tiene prioridad sobre `ref` porque en un PR
# `ref` vale refs/pull/N/merge, distinto del refs/heads/rama del push: con solo
# `ref` los dos runs caerían en grupos distintos y ninguno cancelaría al otro,
# duplicando el consumo de minutos en cada PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y validar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      # Las comprobaciones de fechas van ANTES del build a propósito: no
      # necesitan _site/, y si una fecha está mal el usuario ve el mensaje en
      # español que explica el problema real, en vez de un error críptico de
      # Jekyll varios pasos más abajo.
      - name: Comprobar fechas y nombres de las diapositivas
        run: |
          shopt -s nullglob
          if [ ! -d _posts ]; then
            echo "::error::No existe la carpeta _posts/."
            exit 1
          fi
          archivos=(_posts/*)
          if [ ${#archivos[@]} -eq 0 ]; then
            echo "::error::_posts/ está vacío: la presentación no tiene diapositivas."
            exit 1
          fi

          # `future: false` en _config.yml usa la zona horaria declarada ahí,
          # no UTC ni la del runner. Usar otra produce falsos positivos en la
          # franja entre ambas medianoches.
          zona=$(sed -n 's/^timezone:[[:space:]]*//p' _config.yml | head -1 | tr -d '"'"'"' ')
          hoy=$(TZ="${zona:-UTC}" date +%Y-%m-%d)
          echo "Zona horaria del sitio: ${zona:-UTC} — hoy es $hoy"

          fallo=0
          for archivo in "${archivos[@]}"; do
            nombre=$(basename "$archivo")
            if ! echo "$nombre" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}-'; then
              echo "::error file=$archivo::Nombre inválido: se espera AAAA-MM-DD-slug.md"
              fallo=1
              continue
            fi
            fecha=${nombre:0:10}
            if [ "$fecha" \> "$hoy" ]; then
              echo "::error file=$archivo::Fecha futura en el nombre ($fecha); la diapositiva no se publicaría."
              fallo=1
            fi
            # La clave `date:` del front matter manda sobre la del nombre, así
            # que una fecha futura ahí esconde la diapositiva igual de callada.
            fm=$(sed -n '/^---[[:space:]]*$/,/^---[[:space:]]*$/p' "$archivo" \
                 | sed -n 's/^[[:space:]]*date:[[:space:]]*["'"'"']\?\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\).*/\1/p' \
                 | head -1)
            if [ -n "$fm" ] && [ "$fm" \> "$hoy" ]; then
              echo "::error file=$archivo::Fecha futura en el front matter (date: $fm); manda sobre la del nombre y la diapositiva no se publicaría."
              fallo=1
            fi
          done

          duplicadas=$(printf '%s\n' "${archivos[@]}" | xargs -n1 basename | cut -c1-10 | sort | uniq -d)
          if [ -n "$duplicadas" ]; then
            echo "::error::Fechas duplicadas, el orden de las diapositivas es impredecible: $duplicadas"
            fallo=1
          fi
          exit $fallo

      - name: Preparar Ruby y gemas
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Compilar el sitio y validar enlaces
        run: script/cibuild

      - name: Comprobar que todas las diapositivas se publicaron
        run: |
          shopt -s nullglob
          archivos=$(find _posts -type f \( -name '*.md' -o -name '*.markdown' -o -name '*.html' \) | wc -l)
          # Contamos el marcador que index.html emite exactamente una vez por
          # diapositiva. Contar '<section' infla el recuento: lo emiten también
          # la sección `overview` opcional y cualquier HTML suelto escrito
          # dentro de una diapositiva.
          publicadas=$(grep -o 'class="page-break"' _site/index.html | wc -l)
          echo "Diapositivas en _posts/: $archivos"
          echo "Diapositivas publicadas: $publicadas"
          if [ "$archivos" -ne "$publicadas" ]; then
            echo "::error::Faltan diapositivas en el sitio generado ($publicadas de $archivos)."
            echo "Causas habituales, por orden de probabilidad:"
            echo "  1. Una fecha futura, en el NOMBRE del archivo o en la clave 'date:' del front matter."
            echo "  2. Falta 'layout: slide' en el front matter."
            echo "  3. El nombre no sigue el formato AAAA-MM-DD-slug.md."
            exit 1
          fi

      # La vista previa visual (script/screenshots) NO se genera aquí a
      # propósito. En los runners de GitHub el Chrome disponible no responde a
      # `--screenshot` en modo headless: probado con y sin los flags que evitan
      # keyring/dbus/snap, y siempre acaba en timeout sin producir imágenes.
      # El script funciona bien en local y en las sesiones de Claude Code, que
      # es donde se usa (`/vista-previa`). Mantener el paso aquí solo añadía un
      # aviso permanente y un artefacto vacío.
